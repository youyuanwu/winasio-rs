[package]
name = "winasio-tests"
description = "Integration tests for the winasio crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
winasio = { workspace = true, features = ["test-util"] }
winasio-util = { workspace = true }
winasio-axum = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
warp = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Networking_WinSock", "Win32_Security"] }
criterion = { workspace = true }
tower = { workspace = true }
# axum's `tokio` feature is enabled ONLY here, in winasio-tests' dev-dependencies,
# so the `ConnectInfo<SocketAddr>` *type* compiles for the M2 recipe test. This is
# test-only: it does not enter `winasio-axum`'s normal dependency graph (asserted
# by `dependencies.rs::winasio_axum_pulls_in_no_async_runtime`). winasio-tests
# already carries tokio as a dev-dependency, so this adds no new runtime here.
axum = { workspace = true, features = ["tokio"] }

[[bench]]
name = "httpsys"
harness = false

[[bench]]
name = "fs_pipe"
harness = false
