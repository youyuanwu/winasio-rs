[package]
name = "winasio-tests"
description = "Integration tests for the winasio crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
winasio = { workspace = true, features = ["test-util"] }
winasio-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
warp = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Networking_WinSock"] }
criterion = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }

[[bench]]
name = "httpsys"
harness = false

[[bench]]
name = "fs_pipe"
harness = false
