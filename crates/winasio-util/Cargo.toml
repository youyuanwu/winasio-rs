[package]
name = "winasio-util"
description = "Higher-level HTTP client over WinHTTP and server over HTTP.sys, shaped around the http crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winasio = { workspace = true }
windows = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
bytes = { workspace = true }
tower-service = { workspace = true }
# Runtime-free concurrency primitives (`select`, `join`, `poll_fn`, `noop_waker`).
# `default-features = false` keeps this off any async runtime — see the
# `winasio_util_pulls_in_no_async_runtime` dependency-guard test.
futures-util = { workspace = true }

[dev-dependencies]
# Deliberately not tokio. The client is runtime-agnostic and the doc examples
# and unit tests prove it by running on `futures::executor::block_on`.
futures = { workspace = true }
http-body-util = { workspace = true }
