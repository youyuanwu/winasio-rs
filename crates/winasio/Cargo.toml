[package]
name = "winasio"
description = "Windows Async I/O and Networking lib for Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
windows = { workspace = true }

[dev-dependencies]
# Only for doc examples, which demonstrate that the `winhttp` client needs no
# runtime by driving it on `futures::executor::block_on`.
futures = { workspace = true }

[features]
# Exposes allocation accounting used by the integration test suite.
test-util = []
