[package]
name = "winasio"
description = "Windows Async I/O and Networking lib for Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
windows = { workspace = true }

[dev-dependencies]
# Only for doc examples, which demonstrate that the `winhttp` client needs no
# runtime by driving it on `futures::executor::block_on`.
futures = { workspace = true }

[features]
# Exposes allocation accounting used by the integration test suite, plus the
# `test-util`-gated self-signed certificate helper (`httpsys::SelfSignedCert`).
# The certificate helper needs `Win32_Security_Cryptography`; it is pulled only
# under this feature so the crate's default footprint is unchanged (measured:
# `cargo check -p winasio` with no features does not compile the crypto surface).
test-util = [
    "windows/Win32_Security_Cryptography",
    "windows/Win32_Security_Authorization",
]
