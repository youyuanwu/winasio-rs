name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        BUILD_TYPE: ["Debug"]
        os: [ windows-latest ]
    steps:
    - uses: actions/checkout@v7

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        # channel and components come from rust-toolchain.toml
        cache: false

    # enable cache
    - uses: Swatinem/rust-cache@v2

    - name: Run cargo check
      run: cargo check --workspace --all-targets --all-features

    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run cargo test
      run: cargo test --workspace --all-targets --all-features -- --nocapture

    # `--all-targets` excludes doctests, so compile_fail proofs and examples
    # need their own step.
    - name: Run doc tests
      run: cargo test --workspace --all-features --doc

    # coverage
    - name: run cmake
      run: > 
        cmake . -DCMAKE_BUILD_TYPE=Debug -B build
    
    - name: run coverage
      run: |
        cmake --build build --config Debug --target cov_all
        cmake --build build --config Debug --target cov_summary

    - name: Upload Report to Codecov
      if: ${{ matrix.BUILD_TYPE == 'Debug' }}
      uses: codecov/codecov-action@v7
      with:
        files: ./lcov.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }} # required
