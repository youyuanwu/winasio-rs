name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # The HTTPS TLS tests must genuinely RUN in CI, not silently skip. With
      # this set, an absent or unreadable SSL binding becomes a hard test failure
      # instead of a skip (see crates/winasio-tests/tests/httpsys_tls.rs,
      # `tls_tests_required`), so a broken provisioning step OR a
      # `query_ssl_binding` regression cannot drain all TLS coverage while CI
      # stays green. Provisioning below is a hard gate on GitHub's elevated
      # Windows runners, so reaching the test steps means the binding exists.
      WINASIO_REQUIRE_TLS_TESTS: "1"
    strategy:
      matrix:
        BUILD_TYPE: ["Debug"]
        os: [ windows-latest ]
    steps:
    - uses: actions/checkout@v7

    - name: Install rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        # channel and components come from rust-toolchain.toml
        cache: false

    # enable cache
    - uses: Swatinem/rust-cache@v2

    # gRPC codegen: crates/winasio-tests/build.rs runs tonic-prost-build, which
    # shells out to `protoc` to compile the checked-in .proto (D3/FR-014). It
    # must be on PATH before any cargo step that compiles winasio-tests (check,
    # clippy, test, doc). `repo-token` avoids GitHub API rate limits when the
    # action resolves the release to download.
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # Provision the machine-wide HTTPS test binding once for the whole job.
    # GitHub's Windows runners run elevated, so this generates a self-signed
    # localhost certificate and binds it to the fixed test port; the TLS tests
    # (crates/winasio-tests/tests/httpsys_tls.rs) then RUN unelevated against it.
    #
    # This is a HARD GATE (no `continue-on-error`): provisioning succeeding is a
    # reasonable expectation on the elevated GitHub-hosted `windows-latest`
    # runner, and combined with `WINASIO_REQUIRE_TLS_TESTS=1` above it guarantees
    # the e2e tests genuinely run rather than silently skipping into a green run.
    # If provisioning ever legitimately cannot bind on a runner, that must be
    # surfaced and diagnosed here, not masked. The runner VM is ephemeral, so no
    # teardown is needed. `-NoElevate`: the runner is already elevated, and this
    # guarantees the script never attempts an interactive UAC prompt in CI.
    - name: Provision HTTPS test binding
      shell: pwsh
      run: ./scripts/setup-https-test.ps1 -NoElevate

    - name: Run cargo check
      run: cargo check --workspace --all-targets --all-features

    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Run cargo test
      run: cargo test --workspace --all-targets --all-features -- --nocapture

    # `--all-targets` excludes doctests, so compile_fail proofs and examples
    # need their own step.
    - name: Run doc tests
      run: cargo test --workspace --all-features --doc

    # The cancellation soak is #[ignore]d so the default suite stays fast.
    - name: Run cancellation soak
      run: cargo test --workspace --all-targets --all-features -- --ignored --nocapture

    # coverage
    - name: run cmake
      run: > 
        cmake . -DCMAKE_BUILD_TYPE=Debug -B build
    
    - name: run coverage
      run: |
        cmake --build build --config Debug --target cov_all
        cmake --build build --config Debug --target cov_summary

    - name: Upload Report to Codecov
      if: ${{ matrix.BUILD_TYPE == 'Debug' }}
      uses: codecov/codecov-action@v7
      with:
        files: ./lcov.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }} # required
