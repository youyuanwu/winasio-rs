[workspace]
resolver = "2"
members = ["crates/winasio", "crates/winasio-tests", "crates/winasio-util"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/youyuanwu/winasio-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace.dependencies]
winasio = { path = "crates/winasio" }
winasio-util = { path = "crates/winasio-util" }

# Versions chosen to match hyper 1.x, so that a hyper user's `http` types are
# the same types this workspace's client accepts.
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1.2"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Networking_HttpServer",
    "Win32_Networking_WinSock",
] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
warp = { version = "0.4", features = ["server"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
rand = "0.9"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
