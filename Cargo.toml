[workspace]
resolver = "2"
members = ["crates/winasio", "crates/winasio-axum", "crates/winasio-tests", "crates/winasio-util", "crates/winasio-tonic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/youyuanwu/winasio-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace.dependencies]
winasio = { path = "crates/winasio" }
winasio-util = { path = "crates/winasio-util" }
winasio-axum = { path = "crates/winasio-axum" }
winasio-tonic = { path = "crates/winasio-tonic" }

# Versions chosen to match hyper 1.x, so that a hyper user's `http` types are
# the same types this workspace's client accepts.
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1.2"
# Trait-only, zero transitive dependencies, stable since 2019. This is the same
# Service trait axum and the tower-http middleware ecosystem are built on, so
# taking it does not compromise this workspace's runtime agnosticism.
tower-service = "0.3"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Networking_HttpServer",
    "Win32_Networking_WinSock",
] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
# `FuturesUnordered` (current-thread concurrency) and `FutureExt::catch_unwind`
# (handler-panic containment) for `winasio-axum`. `std` is a superset of `alloc`
# and pulls no async runtime, so the runtime-free story is preserved.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
warp = { version = "0.4", features = ["server"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
rand = "0.9"
# `tower` is dev-only. `axum` is used as a *normal* dependency by `winasio-axum`,
# deliberately with default features off: measured, axum 0.8 with no default
# features pulls no tokio at all, so a real axum Router is servable without a
# runtime entering the picture. Enabling axum's `tokio` feature (only in
# winasio-tests' dev-dependencies, for the ConnectInfo recipe test) does not add a
# runtime to winasio-axum's normal dependency tree.
tower = { version = "0.5", default-features = false, features = ["util"] }
axum = { version = "0.8", default-features = false }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
